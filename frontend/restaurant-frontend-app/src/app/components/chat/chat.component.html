   <!-- button open/close chat -->
    <button class="chat-toggle-btn" (click)="isOpen.set(!isOpen())">
      @if (isOpen()) {
        ✕
      } @else {
        💬
      }
    </button>

    <!-- chat window -->
    @if (isOpen()) {
      <div class="chat-container">
        <!-- chat head -->
        <div class="chat-header">
          <h3>AI Valera</h3>
          <span class="status-badge">online</span>
        </div>

        <!-- Message list -->
        <div class="messages-list">
          @for (msg of chatService.messages(); track $index) {
            <div [class]="'message-wrapper ' + msg.role">
              <div class="message-bubble">
                {{ msg.text }}
              </div>
            </div>
          }
          @if (chatService.isLoading()) {
            <div class="message-wrapper assistant">
              <div class="message-bubble typing">
                <span>.</span><span>.</span><span>.</span>
              </div>
            </div>
          }
        </div>

        @if (chatService.error(); as errorMessage) {
          <div class="chat-error" role="alert">{{ errorMessage }}</div>
        }

        <!-- Input panel -->
        <div class="input-panel">
          <input
            [(ngModel)]="inputQuery"
            (keyup.enter)="send()"
            placeholder="Ask about the menu ..."
            [disabled]="chatService.isLoading()"
          />
          <button (click)="send()" [disabled]="chatService.isLoading() || !inputQuery.trim()">
            ➔
          </button>
        </div>
      </div>
    }
